name: Deploy Ryan India Institute Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ryan-india-institute-frontend/ryan-india/package-lock.json

      - name: Install dependencies
        working-directory: ryan-india-institute-frontend/ryan-india
        run: npm ci

      - name: Build website
        working-directory: ryan-india-institute-frontend/ryan-india
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ryan-india-institute-frontend/ryan-india/dist

      - name: Publish website
        uses: actions/deploy-pages@v4
